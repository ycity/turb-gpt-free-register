services:
  turb-gpt:
    build: .
    image: turb-gpt-free-register:latest
    container_name: turb-gpt-free-register
    restart: unless-stopped
    ports:
      - "5002:5000"
    volumes:
      - ./turb.sqlite3:/app/turb.sqlite3
      - ./logs:/app/logs
      - ./注册日志:/app/注册日志
      - ./data:/app/data
      # Cloak 资料目录：保留 Cloudflare 放行 cookie，容器重启后仍然有效
      - ./cache:/app/cache
      - ./.env:/app/.env
      - ./core:/app/core
      - ./config:/app/config
      - ./webui:/app/webui
      - ./main.py:/app/main.py
    environment:
      - PYTHONUNBUFFERED=1
